<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AK Net - تسجيل الخروج</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f0f9f0 0%, #e8f5e9 50%, #c8e6c9 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .particle {
            position: absolute;
            background: rgba(46, 125, 50, 0.15);
            border-radius: 50%;
            animation: float linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
        }

        .logout-box {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px 30px;
            border: 1px solid rgba(46, 125, 50, 0.2);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .logo-container {
            margin-bottom: 20px;
        }

        .logo {
            width: 140px;
            height: 140px;
            border-radius: 16px; /* مربع بزوايا منحنية */
            object-fit: cover;
            border: 3px solid rgba(46, 125, 50, 0.3);
            box-shadow: 0 12px 36px rgba(46, 125, 50, 0.22);
        }

        .title-section {
            margin-bottom: 30px;
        }

        .main-title {
            font-size: 32px;
            font-weight: 700;
            color: #1b5e20;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 16px;
            color: #2e7d32;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #66bb6a 0%, #43a047 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            box-shadow: 0 10px 30px rgba(76, 175, 80, 0.4);
        }

        .success-icon svg {
            width: 45px;
            height: 45px;
            color: #fff;
        }

        .message-box {
            background: #e8f5e9;
            border: 1px solid #a5d6a7;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .message-title {
            color: #2e7d32;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .message-text {
            color: #33691e;
            font-size: 14px;
            line-height: 1.6;
        }

        .user-info {
            background: #f1f8e9;
            border: 1px solid #c5e1a5;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #c5e1a5;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #689f38;
            font-size: 13px;
        }

        .info-value {
            color: #1b5e20;
            font-size: 13px;
            font-weight: 500;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4caf50 0%, #2e7d32 100%);
            color: #fff;
            box-shadow: 0 10px 30px rgba(76, 175, 80, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(76, 175, 80, 0.5);
        }

        .btn svg {
            width: 18px;
            height: 18px;
        }

        .contact-section {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #c5e1a5;
        }

        .contact-text {
            color: #689f38;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .contact-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 25px;
            background: linear-gradient(135deg, #4caf50 0%, #2e7d32 100%);
            border-radius: 10px;
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .contact-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(76, 175, 80, 0.4);
        }

        .contact-btn svg {
            width: 18px;
            height: 18px;
        }

        @media (max-width: 480px) {
            .logout-box {
                padding: 30px 20px;
            }

            .main-title {
                font-size: 26px;
            }

            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- الجزيئات المتحركة -->
    <div class="particles" id="particles"></div>

    <!-- الحاوية الرئيسية -->
    <div class="container">
        <div class="logout-box">
            <!-- الشعار -->
            <div class="logo-container">
                <img src="img/aknet-logo.png" alt="AK Net Logo" class="logo">
            </div>

            <!-- العنوان -->
            <div class="title-section">
                <h1 class="main-title">AK Net</h1>
                <p class="subtitle">شبكة الإنترنت عبر الأقمار الصناعية</p>
            </div>

            <!-- أيقونة النجاح -->
            <div class="success-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </div>

            <!-- رسالة تسجيل الخروج -->
            <div class="message-box">
                <div class="message-title">تم تسجيل الخروج بنجاح</div>
                <div class="message-text">شكراً لاستخدامك خدمات AK Net<br>نتمنى لك يوماً سعيداً!</div>
            </div>

            <!-- معلومات المستخدم -->
            <div class="user-info">
                <div class="info-row">
                    <span class="info-label">اسم المستخدم:</span>
                    <span class="info-value" id="logout-username">غير متاح</span>
                </div>
                <div class="info-row">
                    <span class="info-label">مدة الاتصال:</span>
                    <span class="info-value" id="logout-uptime">غير متاح</span>
                </div>
                <div class="info-row">
                    <span class="info-label">إجمالي الاستهلاك:</span>
                    <span class="info-value" id="logout-bytes-total">غير متاح</span>
                </div>
                <div class="info-row">
                    <span class="info-label">تنزيل / رفع:</span>
                    <span class="info-value" id="logout-directions">غير متاح</span>
                </div>
            </div>

            <!-- أزرار الإجراءات -->
            <div class="action-buttons">
                <a href="$(link-login-only)" class="btn btn-primary">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                        <polyline points="10 17 15 12 10 7"></polyline>
                        <line x1="15" y1="12" x2="3" y2="12"></line>
                    </svg>
                    <span>تسجيل دخول جديد</span>
                </a>
            </div>

            <!-- قسم التواصل -->
            <div class="contact-section">
                <p class="contact-text">هل تحتاج مساعدة أو تريد تجديد الاشتراك؟</p>
                <a href="https://wa.me/967774093109" target="_blank" class="contact-btn">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"></path>
                    </svg>
                    <span>تواصل عبر واتساب</span>
                </a>
            </div>
        </div>
    </div>

    <script>
        (function() {
            function parseUnsigned(value) {
                return /^\d+$/.test(value) ? Number(value) : null;
            }
            function formatBytes(bytes) {
                if (bytes === null || !isFinite(bytes)) return 'غير متاح';
                if (bytes === 0) return '0 بايت';
                var units = ['بايت', 'KiB', 'MiB', 'GiB'];
                var exponent = Math.max(0, Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1));
                var amount = bytes / Math.pow(1024, exponent);
                return amount.toFixed(amount >= 100 ? 0 : 2).replace(/\.00$/, '').replace(/(\.\d)0$/, '$1') + ' ' + units[exponent];
            }
            var encodedUsername = '$(username-esc)';
            var encodedUptime = '$(uptime-esc)';
            var username = '';
            var uptime = '';
            if (encodedUsername.indexOf('$(') === -1) {
                try { username = decodeURIComponent(encodedUsername.replace(/\+/g, ' ')); } catch (ignore) {}
            }
            if (encodedUptime.indexOf('$(') === -1) {
                try { uptime = decodeURIComponent(encodedUptime.replace(/\+/g, ' ')); } catch (ignore) {}
            }
            var bytesIn = parseUnsigned('$(bytes-in)');
            var bytesOut = parseUnsigned('$(bytes-out)');
            var usernameEl = document.getElementById('logout-username');
            var uptimeEl = document.getElementById('logout-uptime');
            var totalEl = document.getElementById('logout-bytes-total');
            var directionsEl = document.getElementById('logout-directions');
            if (usernameEl) usernameEl.textContent = username || 'غير متاح';
            if (uptimeEl) uptimeEl.textContent = uptime || 'غير متاح';
            if (totalEl) totalEl.textContent = bytesIn === null && bytesOut === null ? 'غير متاح' : formatBytes((bytesIn || 0) + (bytesOut || 0));
            if (directionsEl) directionsEl.textContent = 'تنزيل: ' + formatBytes(bytesOut) + ' / رفع: ' + formatBytes(bytesIn);
        })();
        // إنشاء الجزيئات المتحركة
        function createParticles() {
            var container = document.getElementById('particles');
            for (var i = 0; i < 30; i++) {
                var particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.width = (Math.random() * 4 + 3) + 'px';
                particle.style.height = particle.style.width;
                particle.style.left = (Math.random() * 100) + '%';
                particle.style.bottom = (Math.random() * 100) + '%';
                particle.style.animationDelay = (Math.random() * 15) + 's';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                container.appendChild(particle);
            }
        }
        createParticles();
    </script>
</body>
</html>
