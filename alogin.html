<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AK Net - جاري الاتصال</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f0f9f0 0%, #e8f5e9 50%, #c8e6c9 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px 30px;
            border: 1px solid rgba(46, 125, 50, 0.2);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .logo-container {
            margin-bottom: 20px;
        }

        .logo {
            width: 140px;
            height: 140px;
            border-radius: 16px; /* مربع بزوايا منحنية */
            object-fit: cover;
            border: 3px solid rgba(46, 125, 50, 0.3);
            box-shadow: 0 12px 36px rgba(46, 125, 50, 0.22);
        }

        .main-title {
            font-size: 32px;
            font-weight: 700;
            color: #1b5e20;
            margin-bottom: 30px;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid #c5e1a5;
            border-top-color: #4caf50;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 25px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .message {
            color: #1b5e20;
            font-size: 18px;
            margin-bottom: 15px;
        }

        .sub-message {
            color: #689f38;
            font-size: 14px;
        }

        .redirect-link {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #4caf50 0%, #2e7d32 100%);
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .redirect-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(76, 175, 80, 0.4);
        }
    </style>
    <script>
        // التوجيه التلقائي بعد نجاح تسجيل الدخول
        setTimeout(function() {
            window.location.href = '$(link-redirect)';
        }, 2000);
    </script>
</head>
<body>
    <div class="container">
        <div class="login-box">
            <div class="logo-container">
                <img src="img/aknet-logo.png" alt="AK Net Logo" class="logo">
            </div>
            <h1 class="main-title">AK Net</h1>
            
            <div class="loading-spinner"></div>
            
            <p class="message">تم تسجيل الدخول بنجاح!</p>
            <p class="sub-message">جاري توجيهك إلى صفحة الحالة...</p>
            
            <a href="$(link-redirect)" class="redirect-link">انقر هنا إذا لم يتم التوجيه تلقائياً</a>
        </div>
    </div>
</body>
</html>
